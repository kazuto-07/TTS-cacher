name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The version floor and ceiling on Linux, plus one Windows run: the cache writes
        # files and juggles threads, and those are where the two differ.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        # The live-vendor test is deselected by default, so this never needs a key and
        # never spends characters.
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the distributions
        run: |
          pip install build twine
          python -m build

      - name: Check what would be uploaded
        # Catches a README that will not render on PyPI, and bad metadata, before a
        # release does.
        run: twine check dist/*

      - name: Confirm py.typed ships in the wheel
        run: python -c "import zipfile,glob; names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'tts_cache/py.typed' in names, names"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
