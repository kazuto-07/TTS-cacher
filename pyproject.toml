[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tts-cache"
dynamic = ["version"]
description = "Deterministic, content-addressed TTS caching for any voice AI pipeline (LiveKit, Pipecat, or your own)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
    "tts",
    "cache",
    "voice",
    "speech",
    "latency",
    "voice-ai",
    "livekit",
    "pipecat",
    "elevenlabs",
    "cartesia",
    "openai",
    "murf",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = []

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0"]
supabase = ["supabase>=2.0"]
s3 = ["boto3>=1.28"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "sqlalchemy>=2.0",
    "ruff>=0.5",
]

[project.scripts]
tts-cache = "tts_cache.cli:main"

[project.urls]
Homepage = "https://github.com/kazuto-07/tts-cacher"
Issues = "https://github.com/kazuto-07/tts-cacher/issues"

# One version literal, in src/tts_cache/__init__.py. Declaring it here too is how the
# wheel and the import end up disagreeing after a hurried release.
[tool.hatch.version]
path = "src/tts_cache/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]
# Live-vendor tests are opt-in: a plain `pytest` never touches the network or spends
# characters. Run them with `pytest -m network` (needs MURF_API_KEY).
addopts = "-m 'not network'"
markers = [
    "network: talks to a real TTS vendor over the network; needs an API key",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",
    # __all__ and __slots__ are grouped by meaning here, not alphabetically.
    "RUF022",
    "RUF023",
    # Base-class hooks with nothing to do by default (Storage.close, Index.close).
    "B027",
]
